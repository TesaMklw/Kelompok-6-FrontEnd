<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galeri foto menu Warung Wong Deso.">
    <title>Warung Wong Deso - Galeri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Karla:wght@400;500;600;700&display=swap"
        rel="stylesheet">
 
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <!-- ============ HEADER: logo/nama toko di bagian paling atas ============ -->
    <!-- id="beranda" dipakai sebagai TUJUAN link (misal saat logo diklik, balik ke atas) -->
    <header class="site-header" id="beranda">
        <div class="header-inner">
            <a class="brand" href="#beranda" aria-label="Warung Wong Deso, kembali ke beranda">
                <span class="brand-mark">WD</span>
                <span><strong>Warung Wong</strong><small> DESO</small></span>
            </a>
        </div>
    </header>

    <!-- ============ NAV: menu navigasi (Home, Menu, Galeri, Kontak) ============ -->
    <!-- Tiap href="#xxx" di sini HARUS punya pasangan id="xxx" di suatu tempat di halaman -->
    <!-- href="#beranda"      -> nyambung ke <header id="beranda"> di atas -->
    <!-- href="#menu"         -> nyambung ke <section id="menu"> (tabel harga versi putih) -->
    <!-- href="#gallery-title" -> nyambung ke <h2 id="gallery-title"> di section galeri -->
    <!-- href="#kontak"       -> nyambung ke <footer id="kontak"> di paling bawah -->
    <nav class="site-nav" aria-label="Navigasi utama">
        <div class="nav-inner">
            <ul class="nav-list">
                <li><a class="nav-link active" href="Home.html#beranda">Home</a></li>
                <li><a class="nav-link" href="Menu.html#menu">Menu</a></li>
                <li><a class="nav-link" href="#gallery-title">Galeri</a></li>
                <li><a class="nav-link" href="#kontak">Kontak</a></li>
            </ul>
        </div>
    </nav>

    <section class="gallery section-wrap" aria-labelledby="gallery-title">
        <div class="section-heading">
            <div>
                <h2 id="gallery-title">Foto Menu<em> Warung Wong Deso</em></h2>
            </div>
            <p class="section-intro">Foto Makanan dan minuman di Warung Wong Deso.</p>
        </div>

        <!-- Grid bersarang: gallery-layout (2 kolom besar) berisi gallery-grid (3 kolom foto) + sidebar -->
        <div class="gallery-layout">
            <article class="gallery-grid">
                <!-- Tiap <figure> = satu foto + keterangannya (figcaption) -->
                <figure><img src="gambar/nasi tumpeng.jpg" alt="Nasi Tumpeng" loading="lazy" alt="Rp">
                    <figcaption>Nasi Tumpeng</figcaption>
                    <figcaption>Rp 35.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Ayam Bakar.jpeg" alt="Nasi Ayam Bakar" loading="lazy">
                    <figcaption>Nasi Ayam Bakar</figcaption>
                    <figcaption>Rp 22.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Ayam Goreng.jpeg" alt="Nasi Ayam Goreng" loading="lazy">
                    <figcaption>Nasi Ayam Goreng</figcaption>
                    <figcaption>Rp 20.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Bebek Bakar.jpeg" alt="Nasi Bebek Bakar" loading="lazy">
                    <figcaption>Nasi Bebek Bakar</figcaption>
                    <figcaption>Rp 35.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Bebek Goreng.jpeg" alt="Nasi Bebek Goreng" loading="lazy">
                    <figcaption>Nasi Bebek Goreng</figcaption>
                    <figcaption>Rp 35.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi box.jpeg" alt="Nasi Kotak" loading="lazy">
                    <figcaption>Nasi Kotak</figcaption>
                    <figcaption>Rp 20.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Gila.jpeg" alt="Nasi Gila" loading="lazy">
                    <figcaption>Nasi Gila</figcaption>
                    <figcaption>Rp 15.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Goreng Biasa.jpeg" alt="Nasi Goreng Biasa" loading="lazy">
                    <figcaption>Nasi Goreng Biasa</figcaption>
                    <figcaption>Rp 15.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Goreng Spesial.jpeg" alt="Nasi Goreng Spesial" loading="lazy">
                    <figcaption>Nasi Goreng Spesial</figcaption>
                    <figcaption>Rp 25.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Lele Bakar.jpg" alt="Nasi Lele Bakar" loading="lazy">
                    <figcaption>Nasi Lele Bakar</figcaption>
                    <figcaption>Rp 22.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Lele Goreng.jpeg" alt="Nasi Lele Goreng" loading="lazy">
                    <figcaption>Nasi Lele Goreng</figcaption>
                    <figcaption>Rp 22.000</figcaption>
                </figure>
                <figure><img src="gambar/Nasi Paket.jpeg" alt="Nasi Paket" loading="lazy">
                    <figcaption>Nasi Paket</figcaption>
                    <figcaption>Rp 15.000</figcaption>
                </figure>
                <figure><img src="gambar/Soto Ayam.jpg" alt="Soto Ayam" loading="lazy">
                    <figcaption>Soto Ayam</figcaption>
                    <figcaption>Rp 15.000</figcaption>
                </figure>
                <figure><img src="gambar/Capcay.jpg" alt="Capcay" loading="lazy">
                    <figcaption>Capcay</figcaption>
                    <figcaption>Rp 15.000</figcaption>
                </figure>
                <figure><img src="gambar/Tahu goreng.jpg" alt="Tahu Goreng" loading="lazy">
                    <figcaption>Tahu Goreng</figcaption>
                    <figcaption>Rp 2.000</figcaption>
                </figure>
                <figure><img src="gambar/Tempe goreng.jpg" alt="Tempe Goreng" loading="lazy">
                    <figcaption>Tempe Goreng</figcaption>
                    <figcaption>Rp 2.000</figcaption>
                </figure>
                <figure><img src="gambar/Es Jeruk.jpg" alt="Es Jeruk" loading="lazy">
                    <figcaption>Es Jeruk</figcaption>
                    <figcaption>Rp 5.000</figcaption>
                </figure>
                <figure><img src="gambar/Es Teh Manis.jpg" alt="Es Teh Manis" loading="lazy">
                    <figcaption>Es Teh Manis</figcaption>
                    <figcaption>Rp 5.000</figcaption>
                </figure>
            </article>
        </div>
    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer" id="kontak">
        <div class="footer-inner">

            <!-- WADAH BARIS BAWAH (ISI HARUS DI DALAM SINI) -->
            <div class="footer-bottom-row">
                <!-- Sisi Kiri -->
                <p class="copyright">© 2026 Warung Wong Deso</p>

                <!-- Sisi Kanan -->
                <div class="footer-right">
                    <a href="mailto:manganlur@gmail.com">manganlur@gmail.com</a>
                    <span class="divider">|</span>
                    <a href="tel:+6282122517112">+6282122517112</a>

</body>
