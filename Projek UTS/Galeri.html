<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Foto dari orang-orang yang pernah berkunjung dan hidangan yang pernah dipesan di Warung Wong Deso.">
    <title>Warung Wong Deso - Galeri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <!-- ============ HEADER: logo/nama toko di bagian paling atas ============ -->
    <!-- id="beranda" dipakai sebagai TUJUAN link (misal saat logo diklik, balik ke atas) -->
    <header class="site-header" id="beranda">
        <div class="header-inner">
            <a class="brand" href="home.html" aria-label="Warung Wong Deso, kembali ke beranda">
                <span class="brand-mark">WD</span>
                <span><strong>Warung Wong</strong><small> DESO</small></span>
            </a>
            <!-- ============ NAV: menu navigasi (Beranda, Menu, Galeri, Kontak) ============ -->
            <!-- Tiap href="#xxx" di sini HARUS punya pasangan id="xxx" di suatu tempat di halaman -->
            <!-- href="#beranda"      -> nyambung ke <header id="beranda"> di atas -->
            <!-- href="#menu"         -> nyambung ke <section id="menu"> (tabel harga versi putih) -->
            <!-- href="#gallery-title" -> nyambung ke <h2 id="gallery-title"> di section galeri -->
            <!-- href="#kontak"       -> nyambung ke <footer id="kontak"> di paling bawah -->
            <nav class="site-nav" aria-label="Navigasi utama">
                <div class="nav-inner">
                    <ul class="nav-list">
                        <li><a class="nav-link" href="home.html">Beranda</a></li>
                        <li><a class="nav-link active" href="Galeri.html">Galeri</a></li>                        <li><a class="nav-link" href="Menu.html">Menu</a></li>
                        <li><a class="nav-link" href="Ulasan.html">Ulasan</a></li>
                        <li>
                            <a class="nav-link" href="About.html">Tentang Kami &#9662;</a>
                            <ul class="submenu">
                                <li><a href="About.html#tentang">Profil Kami</a></li>
                                <li><a href="About.html#lokasi">Lokasi</a></li>
                                <li><a href="About.html#kontak">Kontak</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <section class="gallery section-wrap" aria-labelledby="gallery-title">
        <div class="section-heading">
            <div>
                <h2 id="gallery-title">GALERI</h2>
            </div>
            <p class="section-intro">Foto dari orang-orang yang pernah berkunjung dan hidangan yang pernah dipesan.</p>
        </div>

        <!-- Grid bersarang: gallery-layout (2 kolom besar) berisi gallery-grid (3 kolom foto) + sidebar -->
        <div class="gallery-layout">
            <article class="gallery-grid">
                <!-- Tiap <figure> = satu foto + keterangannya (figcaption) -->
                <figure><img src="gambar/pengunjung-ikan-bakar.jpg" alt="Ikan bakar dengan sambal dan lalapan pesanan pengunjung" loading="lazy">
                    <figcaption>Ikan Bakar Sambal</figcaption>
                    <figcaption>Hidangan yang pernah dipesan</figcaption>
                </figure>
                <figure><img src="gambar/pengunjung-makan-bersama.jpg" alt="Pengunjung makan bersama di Warung Wong Deso" loading="lazy">
                    <figcaption>Makan Bersama di Warung</figcaption>
                    <figcaption>Orang-orang yang pernah berkunjung</figcaption>
                </figure>
                <figure><img src="gambar/pesanan-ayam-bakar.jpg" alt="Nasi ayam bakar dengan sate dan sambal pesanan pengunjung" loading="lazy">
                    <figcaption>Nasi Ayam Bakar</figcaption>
                    <figcaption>Hidangan yang pernah dipesan</figcaption>
                </figure>
                <figure><img src="gambar/pesanan-nasi-kotak.jpg" alt="Nasi kotak dalam jumlah banyak pesanan pengunjung" loading="lazy">
                    <figcaption>Nasi Kotak Pesanan</figcaption>
                    <figcaption>Hidangan yang pernah dipesan</figcaption>
                </figure>
                <figure><img src="gambar/nasi-kotak-siap-antar.jpg" alt="Deretan nasi kotak yang siap diantar untuk pesanan" loading="lazy">
                    <figcaption>Nasi Kotak Siap Antar</figcaption>
                    <figcaption>Hidangan yang pernah dipesan</figcaption>
                </figure>
                <figure><img src="gambar/suasana-warung.jpg" alt="Pengunjung sedang makan di meja warung" loading="lazy">
                    <figcaption>Suasana Warung</figcaption>
                    <figcaption>Orang-orang yang pernah berkunjung</figcaption>
                </figure>
            </article>
        </div>
    </section>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
        <div class="footer-inner">
            <!-- WADAH BARIS BAWAH (ISI HARUS DI DALAM SINI) -->
            <div class="footer-bottom-row">
                <!-- Sisi Kiri -->
                <p class="copyright">© 2026 Warung Wong Deso</p>
                <!-- Sisi Kanan -->
                <div class="footer-right" id="kontak">
                    <a href="mailto:manganlur@gmail.com">manganlur@gmail.com</a>
                    <span class="divider">|</span>
                    <a href="tel:+6282122517112">+6282122517112</a>
                </div>
            </div>
        </div>
    </footer>
</body>
